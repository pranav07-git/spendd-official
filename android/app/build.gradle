apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 shrinking/obfuscation for release builds. Opt in with -Pspendd.enableR8=true until a
 * minified build has been tested with llama.rn, ML Kit and WorkManager (keep rules: proguard-rules.pro).
 */
def enableProguardInReleaseBuilds = (findProperty("spendd.enableR8") ?: "false").toString().toBoolean()

/**
 * Release signing: android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword;
 * never committed) or the SPENDD_KEYSTORE_FILE / SPENDD_KEYSTORE_PASSWORD / SPENDD_KEY_ALIAS /
 * SPENDD_KEY_PASSWORD environment variables. Without either, release builds are unsigned.
 */
def releaseSigning = [:]
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def props = new Properties()
    keystorePropertiesFile.withInputStream { props.load(it) }
    releaseSigning = [
        storeFile    : props.getProperty("storeFile"),
        storePassword: props.getProperty("storePassword"),
        keyAlias     : props.getProperty("keyAlias"),
        keyPassword  : props.getProperty("keyPassword"),
    ]
} else if (System.getenv("SPENDD_KEYSTORE_FILE")) {
    releaseSigning = [
        storeFile    : System.getenv("SPENDD_KEYSTORE_FILE"),
        storePassword: System.getenv("SPENDD_KEYSTORE_PASSWORD"),
        keyAlias     : System.getenv("SPENDD_KEY_ALIAS"),
        keyPassword  : System.getenv("SPENDD_KEY_PASSWORD"),
    ]
}
def hasReleaseSigning = !releaseSigning.isEmpty() && releaseSigning.values().every { it }
if (!hasReleaseSigning) {
    logger.warn("Spendd: no release signing key configured (android/keystore.properties or SPENDD_* " +
        "environment variables), so release builds are unsigned and can't be installed.")
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.spendd"
    defaultConfig {
        applicationId "com.spendd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never the public debug key: anyone could sign an "update" with it.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    packaging {
        jniLibs {
            // llama.rn ships seven ~10 MB CPU-tuned builds per ABI and picks the best one at runtime,
            // falling back when one is missing. Keep the generic build plus the two that cover
            // nearly all phones since 2018 (dotprod) and 2022 (dotprod + i8mm); saves ~40 MB.
            excludes += [
                "**/librnllama_v8.so",
                "**/librnllama_v8_2.so",
                "**/librnllama_v8_2_i8mm.so",
                "**/librnllama_v8_2_dotprod_i8mm_hexagon_opencl.so",
                "**/librnllama_jni_v8.so",
                "**/librnllama_jni_v8_2.so",
                "**/librnllama_jni_v8_2_i8mm.so",
                "**/librnllama_jni_v8_2_dotprod_i8mm_hexagon_opencl.so",
            ]
        }
    }
    androidResources {
        // AGP's default ignore list, plus llama.rn's Hexagon DSP kernels (only the hexagon build above uses them).
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>ggml-hexagon"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Payment-screenshot logging: on-device OCR (bundled model, works offline) + background work.
    implementation("com.google.mlkit:text-recognition:16.0.1")
    implementation("androidx.work:work-runtime-ktx:2.10.0")

    testImplementation("junit:junit:4.13.2")
    // Real org.json for JVM unit tests (android.jar only has stubs).
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"

